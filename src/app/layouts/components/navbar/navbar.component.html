<header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10 border-b border-slate-200">

  <div class="flex items-center gap-4">

    <div class="w-12 h-12 bg-acento-amarillo rounded-full overflow-hidden shadow-md shrink-0">
      <img src="assets/images/Logo.jpeg" alt="Logo" class="w-full h-full object-cover">
    </div>
    <h2 class="text-xl font-extrabold text-institucional hidden sm:block tracking-wide">
      Base Misión de Paz HCF
    </h2>
  </div>

  <div class="flex items-center gap-6">

    <div class="flex items-center gap-3 bg-fondo-claro px-4 py-2 rounded-xl border border-slate-200 shadow-inner">
      <div class="w-10 h-10 rounded-full bg-institucional flex items-center justify-center text-white font-bold">
        {{ auth.name()?.charAt(0) }}
      </div>
      <div class="flex flex-col hidden md:flex">
        <span class="text-sm font-bold text-institucional leading-tight">{{ auth.name() }} {{ auth.lastname() }}</span>
        <span class="text-xs text-pizarra leading-tight">{{ auth.authorities() }}</span>
      </div>
    </div>

    <button mat-icon-button class="!text-red-500 hover:!bg-red-50 transition-colors" matTooltip="Cerrar Sesión">
      <mat-icon>power_settings_new</mat-icon>
    </button>

  </div>
</header>
