<app-module-layout moduleName="Gestión de Usuarios" [menuElements]="menuElements">

  <div class="max-w-4xl mx-auto mt-4">
    <app-dynamic-form
      [title]="userForm.value.personId ? 'Actualizar Usuario' : 'Crear Usuario'"
      [fields]="formFields"
      [formGroup]="userForm"
      (onSubmit)="handleSave()"
      (onCancel)="handleCancel()">
    </app-dynamic-form>
  </div>

</app-module-layout>
